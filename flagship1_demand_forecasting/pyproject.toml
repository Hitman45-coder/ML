[project]
name = "demand-forecasting-service"
version = "0.1.0"
description = "Leakage-safe hourly demand forecasting and operational decision API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "joblib>=1.4", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
tracking = ["mlflow>=2.15"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
